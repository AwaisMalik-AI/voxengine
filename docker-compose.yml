services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxengine
      POSTGRES_PASSWORD: voxengine
      POSTGRES_DB: voxengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxengine -d voxengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voxengine:voxengine@postgres:5432/voxengine
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:8000
      STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: .
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      -Q tts,calls,webhooks,default -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voxengine:voxengine@postgres:5432/voxengine
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://api:8000
      STORAGE_PATH: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

volumes:
  pgdata:
  storage:
